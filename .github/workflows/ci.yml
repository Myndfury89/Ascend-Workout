name: CI

# Runs the same four gates used locally, on every push and pull request. This catches
# anything a local gate run missed; it does not replace the local discipline.
on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    name: Four gates (test · assemble · ktlint · detekt)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Run gates
        run: ./gradlew --no-daemon testDebugUnitTest assembleDebug ktlintCheck detekt
