name: CI

# Runs the same four gates used locally, on every push and pull request. This catches
# anything a local gate run missed; it does not replace the local discipline.
on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    name: Four gates (test · assemble · ktlint · detekt)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Run gates
        run: ./gradlew --no-daemon testDebugUnitTest assembleDebug ktlintCheck detekt

      - name: Verify screenshot goldens (Roborazzi)
        run: ./gradlew --no-daemon verifyRoborazziDebug --tests '*ScreenshotTest*'

      - name: Upload screenshot diffs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: roborazzi-diffs
          path: |
            app/build/outputs/roborazzi
            app/src/test/screenshots/*_compare.png
          if-no-files-found: ignore

  supabase:
    name: Supabase SQL + Edge Functions (local only, no project access)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Edge Function tests (age-check)
        working-directory: supabase/functions/age-check
        run: deno fmt --check && deno lint && deno test

      - name: SQL migration tests against a throwaway local Postgres
        run: supabase/tests/run_age_check_local.sh
